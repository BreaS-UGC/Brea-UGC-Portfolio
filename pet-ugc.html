<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Pet UGC - Brea UGC</title>
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Load Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One:wght@400&family=Nunito:wght@300;400;500;600;700;800&family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Load FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        /* Base Styles with Fallback Fonts */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            background: #E5DBF0 !important;
            background-color: #E5DBF0 !important;
            background-image: none !important;
            background-attachment: scroll !important;
            background-repeat: no-repeat !important;
            background-size: auto !important;
            background-position: 0 0 !important;
            filter: none !important;
            box-shadow: none !important;
        }
        
        body {
            color: #212529;
            line-height: 1.6;
            overflow-x: hidden;
            font-family: 'Nunito', Helvetica, Arial, sans-serif;
            font-weight: 400;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        /* Header Styles - Mauve & Gold Theme */
        header {
            padding: 12px 0;
            background: linear-gradient(135deg, #7D6A96 0%, #B5A5C9 100%);
            background-attachment: scroll !important;
            background-image: linear-gradient(135deg, #7D6A96 0%, #B5A5C9 100%) !important;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            position: relative;
            width: 100%;
            overflow: hidden;
        }
        
        header::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100px;
            width: 300px;
            height: calc(100% + 4px);
            background: linear-gradient(135deg, rgba(229, 219, 240, 0.3) 0%, rgba(240, 232, 245, 0.3) 100%);
            border-radius: 0 0 50px 0;
            clip-path: ellipse(150px 100px at 50% 0%);
            z-index: 1;
        }
        
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 2;
        }
        
        .logo {
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .logo img {
            height: 50px;
            width: 750px;
            object-fit: contain;
            object-position: left;
            filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.1));
            transform: scale(3.2) translateY(7px);
            transform-origin: left center;
        }
        
        .logo:hover img {
            transform: scale(3.2) translateY(7px);
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2));
        }
        
        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }
        
        .nav-links a {
            text-decoration: none;
            color: #4A3B5C;
            font-family: 'Comfortaa', Helvetica, Arial, sans-serif;
            font-weight: 400;
            transition: all 0.3s;
            font-size: 16px;
            letter-spacing: 1px;
            padding: 8px 16px;
            border-radius: 4px;
            text-transform: uppercase;
            cursor: pointer;
            display: inline-block;
            position: relative;
            z-index: 1001;
        }
        
        .nav-links a:hover {
            color: #D4AF37;
            background: rgba(212, 175, 55, 0.1);
        }
        
        .dropdown {
            position: relative;
            display: inline-block;
        }
        
        .dropdown-toggle {
            text-decoration: none;
            color: #4A3B5C;
            font-family: 'Comfortaa', Helvetica, Arial, sans-serif;
            font-weight: 400;
            transition: all 0.3s;
            font-size: 16px;
            letter-spacing: 1px;
            padding: 8px 16px;
            border-radius: 4px;
            display: inline-block;
            box-sizing: border-box;
            text-transform: uppercase;
            position: relative;
            z-index: 1001;
        }
        
        .dropdown-toggle:hover {
            color: #D4AF37;
            background: rgba(212, 175, 55, 0.1);
        }
        
        .dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0;
            background: #9F8AB3;
            border-radius: 10px;
            min-width: 150px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            margin-top: 5px;
        }
        
        .dropdown:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        
        .dropdown-menu a {
            display: block;
            padding: 12px 20px;
            color: #4A3B5C;
            text-decoration: none;
            font-size: 14px;
            font-family: 'Comfortaa', Helvetica, Arial, sans-serif;
            transition: background-color 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .dropdown-menu a:hover {
            background: rgba(212, 175, 55, 0.2);
            color: #D4AF37;
        }
        
        .dropdown-menu a:first-child {
            border-radius: 10px 10px 0 0;
        }
        
        .dropdown-menu a:last-child {
            border-radius: 0 0 10px 10px;
        }
        
        /* Main Content */
        .main-content {
            padding: 80px 0;
            text-align: center;
        }
        
        .main-content h1 {
            font-family: 'Comfortaa', Helvetica, Arial, sans-serif;
            font-size: 3rem;
            color: #4A3B5C;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        
        .main-content p {
            font-family: 'Nunito', Helvetica, Arial, sans-serif;
            font-size: 1.2rem;
            color: #6c757d;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.8;
        }
        
        /* Mobile Navigation (hidden by default) */
        .mobile-nav-toggle {
            display: none;
        }
        
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            
            .mobile-nav-toggle {
                display: block;
                background: none;
                border: none;
                font-size: 24px;
                color: #4A3B5C;
                cursor: pointer;
            }
        }
    </style>
</head>
<body>
    <!-- Header Navigation -->
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">
                    <img src="Brea UGC logo.svg" alt="Brea UGC" />
                </a>
                
                <!-- Desktop Navigation -->
                <div class="nav-links">
                    <a href="index.html#paid-ads">Paid Ads</a>
                    <a href="index.html#organic">Organic Concepts</a>
                    <a href="index.html#services">Services</a>
                </div>
                
                <!-- Mobile Navigation Toggle -->
                <button class="mobile-nav-toggle" onclick="toggleMobileNav()">☰</button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <div class="main-content">
        <div class="container">
            <h1>Pet UGC</h1>
            <p>Coming soon! This page will feature our specialized pet-focused User Generated Content services. Stay tuned for updates on our furry friend content creation offerings.</p>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // Mobile Navigation Toggle
        function toggleMobileNav() {
            // This function can be expanded when mobile nav is fully implemented
            console.log('Mobile nav toggle clicked');
        }
    </script>
</body>
</html>
